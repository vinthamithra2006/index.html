<html>
<head>
<center><h1>TARANG 2k26</h1></center>
</head>
<body>
<form>
<h1>Registration</h1>
<label>Name</label><br>
<input type ="text"><br>
<br>
<label>Department</label><br>
<input type ="text"><br>
<br>
<label>College Name</label><br>
<input type="text"><br>
<br>
<hr>
<h2>Personal Details</h2>
<label>Email:</label>
<input type="email"><br>
<label>Gender</label><br>
<input type="radio"name="Gender">Male<br>
<input type="radio"name="Gender">FeMale<br>
<input type="radio"name="Gender">Others<br>
<hr>
<h2>Event Details</h2>
<label>Select The Event</label>
<select>
<option>quizz</option>
<option>solo dance</option>
<option>Group dance</option>
<option>group singing</option>
<option>solo singing</option>
</select>
<br>
<label>Payment Method</label><br>
<input type="radio"name="Pay">Online<br>
<input type="radio"name="pay">Offline<br>
<label>Payment Screenshot:</label>
<input type="file" accept="image/*" required>
<hr>
<label>Event Date</label>
<input type="date">
<br>
<label>Event Time</label>
<input type="time">
<br>
<label>Registration Date & Time</label>
<input type="datetime-local">
<hr>
<h2>Food Details</h2>

<label>Food Preference</label>
<input type="radio" name="food" value="veg"> Veg
<input type="radio" name="food" value="nonveg"> Non-Veg
<input type="radio" name="food" value="jain"> Jain

<br><br>

<label>Meal Required</label><br>
<input type="checkbox"> Breakfast
<input type="checkbox"> Lunch
<input type="checkbox"> Dinner

<br><br>
<label>Food Tokens</label>
<select>
  <option>1 Token - Rs.100</option>
  <option>2 Tokens - Rs.180</option>
  <option>Full Day - Rs.250</option>
  <option>Not Required</option>
</select>
<br>
<input type="submit" value="Submit">
<button type="submit">Submit Registration</button>
<br>
<input type="reset" value="Reset">
<button type="reset">Reset Form</button>
</form>
</body>
</html>
